services:
  db:
    image: postgres:18
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # Intentionally NOT published: only the frontend (SvelteKit) talks to the
    # backend, via the in-network hostname `backend` over BACKEND_PREFIX.
    # Re-add `ports: ["8000:8000"]` here if you need to debug the API from
    # the host (e.g. `curl http://localhost:8000/api/health`).
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      VALKEY_URL: redis://valkey:6379/0
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_PROPERTIES: ${SEED_PROPERTIES:-}
      # LLM (OpenAI-compatible chat completions endpoint). The default points
      # at host.docker.internal:1234, which reaches an LM Studio / llama.cpp
      # server running on the Docker host. Override via .env if your model
      # server lives elsewhere.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      LLM_API_KEY: ${LLM_API_KEY:-not-needed}
      # LLM_MODEL is a placeholder by default — `local-model` is accepted by
      # most OpenAI-compatible servers as a stub id. To use the llama.cpp
      # server shipped on the host (the one reachable at
      # http://localhost:1234/v1), set:
      #   LLM_MODEL=unsloth/Qwen3.6-35B-A3B-MTP-GGUF:Q4_K_XL
      # in .env. Override for any other OpenAI-compatible model.
      LLM_MODEL: ${LLM_MODEL:-local-model}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    develop:
      watch:
        - path: ./backend
          action: rebuild

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_PREFIX: http://backend:8000
    ports:
      - "3000:3000"
    environment:
      BACKEND_PREFIX: http://backend:8000
      ORIGIN: http://localhost:3000
      NODE_ENV: production
    depends_on:
      - backend
    develop:
      watch:
        - path: ./frontend
          action: rebuild

volumes:
  postgres_data:
  valkey_data:
